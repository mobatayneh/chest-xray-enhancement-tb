[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-xray-enhancement-tb"
version = "0.1.0"
description = "Reproducible image-enhancement experiments for tuberculosis-consistent chest radiograph classification"
requires-python = ">=3.12,<3.14"
dependencies = ["torch>=2.13,<2.14", "torchvision>=0.28,<0.29", "numpy>=2.5,<3", "pandas>=3,<4", "scikit-learn>=1.9,<2", "opencv-python-headless>=4.14,<5", "matplotlib>=3.11,<4", "filelock>=3.32,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[project.scripts]
cxr-enhance = "cxr_enhance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
